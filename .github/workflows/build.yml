name: Build Modules

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      private_key:
        description: "Ed25519 private key hex to sign with (empty = don't sign)"
        type: string
        default: ""
      build_example:
        description: "Also build the bundled HelloWorld example"
        type: boolean
        default: true

env:
  WASI_SDK_VERSION: "25.0"
  WASI_SDK_TAG: "wasi-sdk-25"

jobs:
  build:
    runs-on: ubuntu-latest
    name: build (.wasm)
    env:
      KMOD_SIGNING_KEY: ${{ github.event.inputs.private_key || secrets.MODULE_SIGNING_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 curl ca-certificates nlohmann-json3-dev

      - name: Cache wasi-sdk
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Install wasi-sdk ${{ env.WASI_SDK_VERSION }}
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/${WASI_SDK_TAG}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl -fSL "$url" -o /tmp/wasi-sdk.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1

      - name: Show toolchain versions
        run: |
          cmake --version
          /opt/wasi-sdk/bin/clang++ --version

      - name: Configure
        run: |
          set -euo pipefail
          example="${{ github.event.inputs.build_example || 'true' }}"
          cmake -S . -B build -G Ninja \
            -DWASI_SDK=/opt/wasi-sdk \
            -DKMOD_BUILD_EXAMPLE="${example}" \
            -DKMOD_SIGN_MODULES=ON

      - name: Build
        run: cmake --build build -j

      - name: List artifacts
        run: ls -lh build/*.wasm build/*.aot 2>/dev/null || true

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenModules-wasm
          path: |
            build/*.wasm
            build/*.aot
          if-no-files-found: error
